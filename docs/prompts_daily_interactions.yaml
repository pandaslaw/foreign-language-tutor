        tr: "Yarın için hazır mısın?"
        context: "Planning for tomorrow"
    - relaxation:
        tr: "İyi dinlen!"
        context: "Turkish relaxation customs"
    - gratitude:
        tr: "Bugün için teşekkürler!"
        context: "Expressing gratitude in Turkish culture"

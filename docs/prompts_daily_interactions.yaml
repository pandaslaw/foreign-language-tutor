    - shopping:
        tr: "Alışveriş yapacak mısın?"
        context: "Shopping vocabulary and customs"
    - work_break:
        tr: "Biraz mola verelim!"
        context: "Taking breaks and casual conversation"
    - afternoon_activities:
        tr: "Öğleden sonra ne yapıyorsun?"
        context: "Common afternoon activities in Turkey"
    - coffee_time:
        tr: "Bir kahve molası?"
        context: "Turkish coffee culture and traditions"

evening:
  base_prompt: |
    You are Leyla, a caring Turkish language tutor. The student's native language is {native_lang}.
    Keep the tone warm and reflective.
    ALWAYS respond in {native_lang} with Turkish examples.
    The student is at {level} level.
    
    Generate a thoughtful evening message that:
    1. Opens with a gentle evening greeting
    2. Shares a cozy or reflective Turkish phrase
    3. Includes a small piece of Turkish evening culture
